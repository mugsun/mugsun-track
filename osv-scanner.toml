# osv-scanner 忽略列表（清单 3.1）。新增条目必须找安全官审。
# 每条都要写 id、scope、added（登记日期）、ignoreUntil、reason。
# scope 必填："prod"（生产依赖，ignoreUntil 不超过 added 起 30 天）
# 或 "dev"（开发依赖，不超过 90 天）。
# 日期用 TOML 原生日期（不加引号），例如：
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# scope = "dev"
# added = 2026-10-21
# ignoreUntil = 2027-01-19
# reason = "无修复版本；仅开发依赖，不进发布产物"
