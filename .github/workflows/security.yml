name: Security scan

# 清单 3.1、3.7、3.10、3.16：osv-scanner + pnpm audit，推任意分支、PR 时跑，每天定时再跑一次；
# 定时任务失败自动开 issue（已有未关 issue 时只追加评论）
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 1 * * *' # 每天 09:17（北京时间）
  workflow_dispatch:

# 同一分支有新推送时取消旧运行。main 上每个 SHA 单独一组、也不取消，连推多次时排队中的运行
# 不会被后来的推送顶掉，每次推送都要完整跑完（gate audit 逐次比对 before）
# group 里保留 event_name（代码质量官 S1）：push、pull_request、workflow_dispatch 是不同事件，
# 各自的结果都要留下，同一分支上不同事件的运行不应互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # 工具钉版本 + 哈希，下载后校验，不符即失败（清单 3.7）
  OSV_SCANNER_VERSION: v2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install osv-scanner (pinned, sha256 verified)
        run: |
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/osv-scanner

      # 共享门禁（清单 3.13）：先校验拷贝的脚本没被改，再自测、校验忽略列表
      - name: Verify shared vuln-gate
        run: sha256sum -c scripts/vuln-gate.sha256

      - name: Self-test vuln-gate
        run: |
          python3 scripts/test_vuln_gate.py
          python3 scripts/test_gate_audit.py
          python3 scripts/test_security_workflow.py
          python3 scripts/mutate_vuln_gate.py

      - name: Check osv-scanner.toml
        run: python3 scripts/vuln-gate.py config osv-scanner.toml --effective "$RUNNER_TEMP/osv-effective.toml"

      # --all-packages 列出全部包，门禁据此确认「扫到了东西」；退出码交给门禁判断
      - name: Scan pnpm-lock.yaml
        id: scan
        run: |
          rc=0
          osv-scanner scan source --all-packages --config "$RUNNER_TEMP/osv-effective.toml" \
            --lockfile pnpm-lock.yaml --format json --output-file osv.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Gate (High/Critical fails, Medium/Low warns)
        env:
          OSV_RC: ${{ steps.scan.outputs.rc }}
        run: |
          python3 scripts/vuln-gate.py results --format osv --exit-code "$OSV_RC" \
            --ignores osv-scanner.toml --require-packages osv.json

  audit:
    name: pnpm audit (high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify shared vuln-gate
        run: sha256sum -c scripts/vuln-gate.sha256
      # 只读 lockfile 查询 advisories，不装依赖、不跑安装脚本；结果交给共享门禁判定
      - name: pnpm audit
        id: audit
        run: |
          rc=0
          pnpm audit --audit-level=high --json > audit.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Gate
        env:
          AUDIT_RC: ${{ steps.audit.outputs.rc }}
        run: |
          python3 scripts/vuln-gate.py results --format pnpm-audit --exit-code "$AUDIT_RC" \
            --ignores osv-scanner.toml --require-packages audit.json

  # 清单 3.15、安全官 S2 / F1 / G1、代码质量官 A1 / A2：门禁文件变更审计，只在 push / PR 上跑。
  # main 上的 push 比 github.event.before；功能分支 push 比 merge-base(origin/main, HEAD)
  # （分支首推 before 全 0）；PR 比 merge-base(base, HEAD)。.github/workflows/** 任何改动、
  # 共享脚本或哈希、osv / gitleaks 配置等受保护文件有改动就变红，交安全官复核。
  # base 为空、全 0 或不可达时直接失败，不交给本次提交里的脚本判断；
  # 只有 base 存在但还没有 gate-audit.py（首次引入）时才用本次的脚本，并且同样判红。
  # 注意：本 job 跑的是本次提交的 workflow，改 workflow 本身仍可绕过，见 README「已知局限」。
  # 脚本只吃 --base 参数，以后可原样搬进 mugsun/.github 的 reusable workflow。
  gate-audit:
    name: gate audit
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit gate changes
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 功能分支 push（清单 3.16）和手动触发：不用 before，改和 origin/main 的 merge-base 比；
          # 算不出来（没有共同祖先、origin/main 不存在）就判红。main 上的 push 和 PR 规则不变。
          if [ "$EVENT" = workflow_dispatch ] || { [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; }; then
            if ! BASE_SHA=$(git merge-base origin/main HEAD); then
              echo "::error::算不出和 origin/main 的 merge-base，无法审计门禁改动"
              exit 1
            fi
          fi
          case "$BASE_SHA" in
            "" | *[!0]*) ;;
            *) echo "::error::base 全 0（新分支首推或 tag 推送），无法审计门禁改动"; exit 1 ;;
          esac
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::base '${BASE_SHA}' 为空或不可达，无法审计门禁改动"
            exit 1
          fi
          if [ "$EVENT" = pull_request ]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" HEAD)
          fi
          script="$RUNNER_TEMP/gate-audit.py"
          first=0
          if git cat-file -e "${BASE_SHA}:scripts/gate-audit.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/gate-audit.py" > "$script"
          else
            echo "::error::base 上还没有 gate-audit.py（首次引入），本次用提交里的版本，需安全官复核"
            cp scripts/gate-audit.py "$script"
            first=1
          fi
          rc=0
          python3 "$script" --base "$BASE_SHA" || rc=$?
          if [ "$first" -eq 1 ]; then exit 1; fi
          exit "$rc"

  # gate audit 在 main 的 push 上失败时开 issue（安全官 G1-3）：功能分支上动了 workflow
  # 判红是预期的，不开 issue
  gate-audit-notify:
    name: Open issue on gate audit failure
    needs: [gate-audit]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="门禁审计失败，需安全官复核"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          body="提交 ${SHA} 改动了门禁文件或 workflow，gate audit 判红：$RUN_URL"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body

          请安全官看运行日志，确认改动符合提交说明里的理由后，在本 issue 记一笔再关闭。"
          fi

  # 清单 3.2、3.6：密钥扫描，push、PR 和每日定时都跑；fetch-depth: 0 拿全历史
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, sha256 verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
          rm "$f"

      - name: Scan
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  notify:
    name: Open issue on scheduled failure
    needs: [osv, audit, gitleaks]
    if: (failure() || cancelled()) && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="每日安全扫描失败"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          body="$(date -u +%F) 的每日扫描失败：$RUN_URL"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body
          
          osv-scanner、pnpm audit 或 gitleaks 发现需要处理的问题（或工具本身出错），详见运行日志。
          同一问题再次失败时只在本 issue 追加评论。"
          fi
