name: CI

# 清单 3.16：分支先绿再进 main，所以推任意分支都跑；pull_request 保留（gate-audit 也锁了这一条）
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支有新推送时取消旧运行。main 上每个 SHA 单独一组、也不取消，连推多次时排队中的运行
# 不会被后来的推送顶掉，每次推送都要完整跑完（gate audit 逐次比对 before）
# group 里保留 event_name（代码质量官 S1）：push、pull_request、workflow_dispatch 是不同事件，
# 各自的结果都要留下，同一分支上不同事件的运行不应互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 清单 3.2/3.8：顶层权限只读、禁 pull_request_target、id-token 只给发布 job、uses 钉 SHA
  workflow-lint:
    name: Workflow permissions / pinned SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check workflows
        run: python3 scripts/check-workflows.py

  # 清单 3.3：只查本次新增的 CHANGELOG 行（行宽 <= 80、子项缩进两格）
  changelog:
    name: CHANGELOG lines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check CHANGELOG
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 功能分支推送和手动触发：和 origin/main 的 merge-base 比（首推时 before 全 0）
          if [ "$EVENT" = workflow_dispatch ] || { [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; }; then
            if ! BASE=$(git merge-base origin/main HEAD); then
              echo "::error::算不出和 origin/main 的 merge-base，无法检查 CHANGELOG"
              exit 1
            fi
          fi
          # 代码质量官 S1：BASE 为空、全 0 或不可达时直接失败；脚本里退回 HEAD~1 的兜底只给本地用
          case "$BASE" in
            "" | *[!0]*) ;;
            *) echo "::error::base 全 0，无法检查 CHANGELOG"; exit 1 ;;
          esac
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::base '${BASE}' 为空或不可达，无法检查 CHANGELOG"
            exit 1
          fi
          python3 scripts/check-changelog.py "$BASE"

  build:
    name: Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 版本取自 package.json 的 packageManager（与 mugsun-pc 同为 pnpm@11.28.2，需 Node >= 22.13）
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
