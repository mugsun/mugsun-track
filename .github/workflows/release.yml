name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm when version changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Check whether version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$NAME@$VER already on npm"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Will publish $NAME@$VER"
          fi
      - if: steps.check.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip == 'false'
        run: pnpm typecheck && pnpm test && pnpm build
      - if: steps.check.outputs.skip == 'false'
        name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.5.1
      - if: steps.check.outputs.skip == 'false'
        name: Publish via npm trusted publishing (OIDC, no token)
        run: npm publish --provenance --access public
