name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm when version changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        # 不开 setup-node 的 pnpm 缓存：跳过发版时不装依赖、缓存目录不存在，post 步骤会报错让整个 run 变红
        with:
          node-version: '24'
      # 只有 E404 算「未发布」，其他 npm 错误让 job 失败；未发布时要求版本严格大于 npm latest
      - name: Check whether version is already published
        id: check
        run: bash scripts/release-check.sh
      - if: steps.check.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip == 'false'
        run: pnpm typecheck && pnpm test && pnpm build
      - if: steps.check.outputs.skip == 'false'
        name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.5.1
      - if: steps.check.outputs.skip == 'false'
        name: Publish via npm trusted publishing (OIDC, no token)
        run: npm publish --provenance --access public
